<style>
:root{--bg:#fff8f0;--sf:#ffffff;--ink:#2d2a4a;--mut:#7a7594;--line:#ebe4f5;--red:#ef476f;--ok:#06a77d;--hl:#ffe69a;--acc:#7c5cff;--acc2:#ff8a5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a2e;--sf:#27244a;--ink:#f1eefc;--mut:#a7a2c7;--line:#3a3562;--red:#ff7b97;--ok:#4fd1a5;--hl:#5a4a1a;--acc:#a48cff;--acc2:#ff9d7a}}
:root[data-theme="dark"]{--bg:#1c1a2e;--sf:#27244a;--ink:#f1eefc;--mut:#a7a2c7;--line:#3a3562;--red:#ff7b97;--ok:#4fd1a5;--hl:#5a4a1a;--acc:#a48cff;--acc2:#ff9d7a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(120deg,var(--acc),var(--acc2));color:#fff;padding:22px 16px 20px;border-radius:0 0 22px 22px}
header h1{max-width:860px;margin:0 auto;font-size:1.4em;font-weight:700}
header p{max-width:860px;margin:4px auto 0;color:rgba(255,255,255,.88);font-size:.92em}
nav{display:flex;gap:8px;max-width:860px;margin:14px auto 0;padding:0 16px;overflow-x:auto}
nav button{background:var(--sf);border:1px solid var(--line);color:var(--ink);font:inherit;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
main{max-width:860px;margin:0 auto;padding:18px 16px 48px}
.box{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(124,92,255,.07)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}
.big{font-size:2em;font-weight:700;color:var(--acc)}
.btn{border:none;background:var(--acc);color:#fff;font:inherit;padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:600}
.btn.o{background:var(--sf);color:var(--acc);border:1px solid var(--acc)}
.btn:disabled{opacity:.35;cursor:default}
.btn.link{background:none;border:none;color:var(--mut);text-decoration:underline;padding:4px}
.list{display:grid;gap:8px}
.item{display:block;width:100%;text-align:left;background:var(--sf);color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:14px;padding:12px 14px;font:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:transform .15s,box-shadow .15s}
.item:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(124,92,255,.15)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tag{display:inline-block;background:var(--hl);color:var(--ink);padding:2px 10px;border-radius:999px;font-size:.78em}
.metin{border-left:4px solid var(--acc2);background:rgba(255,138,92,.08);border-radius:0 10px 10px 0;padding:8px 14px;margin:10px 0;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:7px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc);background:rgba(124,92,255,.07)}
.opt.sel{background:rgba(124,92,255,.15);border-color:var(--acc)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--red);color:#fff;border-color:var(--red)}
.exp{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;color:var(--ink)}
.hide{display:none}
input,select{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input{flex:1}
.done{text-decoration:line-through;color:var(--mut)}
.center{text-align:center}
textarea.note{width:100%;margin-top:10px;font:inherit;color:var(--ink);background:var(--sf);border:1px dashed var(--line);border-radius:10px;padding:8px;resize:vertical}
</style>
</head>

<script>
const D={"Türkçe":"#b03a2e","Matematik":"#2f5d9e","Fen Bilimleri":"#2e7d4f","İnkılap Tarihi":"#9a6b12","Din Kültürü":"#1f6f6f","İngilizce":"#7a4a7a"};

// Simülasyon dağılımı (toplam 90 soru)
const SIM_COUNT={"Türkçe":20,"Matematik":20,"Fen Bilimleri":20,"İnkılap Tarihi":10,"Din Kültürü":10,"İngilizce":10};
const SIM_TOTAL=Object.values(SIM_COUNT).reduce((a,b)=>a+b,0);
const SIM_MIN=135;

// LGS yeni nesil bankası: [ders, metin, soru, şıklar, doğru, açıklama, konu]
const Q=[
/* ================= TÜRKÇE (40) ================= */
["Türkçe","Bir köyde yaşlı bir adam her sabah aynı yola çıkar, yol kenarındaki fidanları sular, sonra dönerdi. Köylüler “Bu ağaçların gölgesinde sen oturamayacaksın” dediğinde gülümseyip “Ben de başkalarının diktiği ağaçların gölgesinde oturdum” derdi.","Yaşlı adamın bu davranışının temel nedeni aşağıdakilerden hangisidir?",["Kendi çıkarını gözetmek","Sonraki nesillere fayda sağlamak","Köylülerin takdirini kazanmak","Boş vakti değerlendirmek"],1,"Adam, kendisinin yararlanmayacağı ağaçları gelecek nesiller için dikiyor.","Paragraf – ana düşünce"],
["Türkçe","“Okuduğum kitaplar bana yalnızca bilgi vermedi; farklı hayatlara girip başka gözlerle bakabilmeyi de öğretti.”","Bu cümleden aşağıdakilerden hangisi çıkarılamaz?",["Okumanın yararı yalnızca bilgi edinmektir.","Okumak bakış açısını geliştirebilir.","Kitaplar başkalarını anlamaya yardım edebilir.","Anlatıcı kitaplardan bilgi dışında da kazanç sağlamıştır."],0,"“Yalnızca bilgi vermedi” ifadesi okumanın bilgiden fazlasını sağladığını söyler.","Paragraf – anlam çıkarma"],
["Türkçe","Bir sanat eserinin değeri, kaç kişinin beğendiğiyle değil, bıraktığı izle ölçülür.","Parçanın ana düşüncesi aşağıdakilerden hangisidir?",["Sanat eserleri çok beğenilmelidir.","Eserin değeri beğeni sayısıyla belirlenir.","Bir eserin değeri bıraktığı etkiyle anlaşılır.","Sanatçılar kalabalıklara göre üretmelidir."],2,"Metin, değeri beğeni sayısı yerine bırakılan etkide arıyor.","Paragraf – ana düşünce"],
["Türkçe","Kütüphanenin kapısı açıldığında eski kâğıtların kokusu her yere sinmişti.","Bu cümlede hangi duyuya yer verilmiştir?",["Görme","Koku","Tat","Dokunma"],1,"“Kokusu” ifadesi koku duyusuna dayanır.","Anlatım biçimleri"],
["Türkçe","Tarlasını yıllardır sürmeyen çiftçi, toprağın yorulduğunu söylerken bile umudunu kaybetmemişti; ona göre toprak yeniden canlanmayı unutmazdı.","Yazar çiftçiyi nasıl tanıtmıştır?",["Tembel ve ümitsiz","Sabırlı ve umutlu","Bilgisiz ve kararsız","Öfkeli ve kıskanç"],1,"Çiftçinin toprağa güvenmesi sabırlı ve umutlu bir karakteri gösterir.","Paragraf – anlam çıkarma"],
["Türkçe","Bu kitap bir çocuk masalı gibi başlar, ama sonunda hayatın zorlukları hakkında ağır sorular sorar.","Bu cümlelerden hangisi çıkarılabilir?",["Kitap yalnızca çocuklara hitap eder.","Kitabın dili yetişkinlere uygun değildir.","Kitap, masal kılığında ciddi konulara değinir.","Kitabın sonu mutlu bitmektedir."],2,"Metin, masal görünümlü bir eserin ciddi konulara değindiğini söyler.","Paragraf – anlam çıkarma"],
["Türkçe","Yazar, romanında geçmişi anlatırken sık sık bugüne döner; böylece okur, olayların nedenlerini kendi zihninde birleştirir.","Yazar hangi anlatım tekniğini kullanmıştır?",["Geriye dönüş","Betimleme","Diyalog","Karşılaştırma"],0,"Geçmişe gidip yeniden bugüne dönen anlatım geriye dönüştür.","Anlatım biçimleri"],
["Türkçe","Kelimeler kullanıldıkları bağlamda anlam kazanır; “yüksek” sözcüğü bir binada yükseklik, bir sesde ise şiddet anlamına gelebilir.","Bu metinden sözcük anlamıyla ilgili hangi bilgiye ulaşılır?",["Sözcükler her zaman sabit anlam taşır.","Sözcüğün anlamı kullanıldığı bağlama göre değişir.","“Yüksek” sözcüğü yalnızca ses için kullanılır.","Bağlam anlamı hiçbir zaman değiştirmez."],1,"Metin, anlamın bağlama göre değiştiğini örnekle gösteriyor.","Sözcükte anlam"],
["Türkçe","Bir öğrenci sınavdan önce notlarını tekrar etmek yerine konuları birbirine bağlamaya çalışırsa, bilgi daha kalıcı olur.","Metne göre kalıcı öğrenmeyi sağlayan şey nedir?",["Notları ezberlemek","Konuları birbiriyle ilişkilendirmek","Sınav saatinde çalışmak","Kısa sürede çok soru çözmek"],1,"Metin, konular arasında bağ kurmanın öğrenmeyi kalıcı kıldığını söyler.","Paragraf – anlam çıkarma"],
["Türkçe","Şehir hayatının koşuşturması içinde insanlar birbirine yabancılaşmış görünebilir. ____ bu yabancılık, dayanışmanın gerekliliğini de artırır.","Boşluğa en uygun bağlaç hangisidir?",["Ancak","Yani","Çünkü","Ve"],0,"Cümle olumsuz bir duruma karşı bir karşıt düşünce getirdiği için “ancak” uygundur.","Dil bilgisi – bağlaçlar ve cümle öğeleri"],
["Türkçe","Bu deneme yazısında yazar, teknolojinin hayatı kolaylaştırdığını kabul etmekle birlikte insanlar arasındaki bağın zayıfladığını savunuyor.","Yazarın bakış açısı nasıl ifade edilebilir?",["Teknolojiyi tamamen reddediyor.","Faydasını kabul edip olumsuz etkisine dikkat çekiyor.","Teknolojinin hiçbir yararı olmadığını söylüyor.","Teknolojinin bağları güçlendirdiğini savunuyor."],1,"Yazar hem faydayı kabul ediyor hem de bağların zayıflamasına dikkat çekiyor.","Paragraf – yazarın tutumu"],
["Türkçe","Dedesi her akşam aynı hikâyeyi anlatırdı; her seferinde biraz değişir, yeni bir ayrıntıyla zenginleşirdi.","Bu cümlelerden hangisi çıkarılamaz?",["Hikâye her anlatışta farklılaşıyordu.","Dedenin anlattığı hikâye yenilikler içeriyordu.","Anlatılan hikâye tamamen aynı kalıyordu.","Dede hikâyeyi düzenli olarak tekrarlardı."],2,"Metin hikâyenin her anlatımda değiştiğini söylüyor.","Paragraf – anlam çıkarma"],
["Türkçe","Ölçü ve tartıda hassas olan bir zanaatkâr, malzemesini tanır ve her adımda sabırla ilerler.","Metinde zanaatkârın hangi özelliği öne çıkarılmıştır?",["Aceleci ve plansız","Hassas ve sabırlı","Tembel ve dağınık","Kendini beğenmiş"],1,"Metin, zanaatkârın hassas olduğunu ve sabırla çalıştığını anlatır.","Paragraf – anlam çıkarma"],
["Türkçe","Öğrenciler yalnızca sonucu değil süreci de değerlendirirse, başarısızlık bir son olmaktan çıkar, öğrenmenin bir parçası hâline gelir.","Metinde hangi görüş savunulmaktadır?",["Sonuç her zaman önemlidir.","Başarısızlık öğrenmenin bir parçası olabilir.","Süreç değerlendirilmemelidir.","Öğrenciler sınavlardan uzak durmalıdır."],1,"Sürecin değerlendirilmesiyle başarısızlık öğretici hâle gelebilir.","Paragraf – ana düşünce"],
["Türkçe","Köy yolunun iki yanına dizilmiş kavaklar, rüzgârda sanki bir selam verir gibi eğiliyordu.","Bu cümlede hangi söz sanatı kullanılmıştır?",["Benzetme","Kişileştirme","Abartma","Tezat"],1,"Ağaçların selam vermesi, cansız varlığa insan özelliği verildiğini gösterir.","Söz sanatları"],
["Türkçe","Haberi okurken kaynağını sorgulamayan okur, yanlış bilgiyle kolayca yönlendirilebilir.","Metne göre okur nasıl davranmalıdır?",["Haberleri hiç okumamalıdır.","Haberlerin kaynağını sorgulamalıdır.","Her haberi olduğu gibi kabul etmelidir.","Yalnızca yerel haberleri takip etmelidir."],1,"Metin, kaynağı sorgulamanın yanıltıcı bilgilere karşı koruduğunu söyler.","Paragraf – anlam çıkarma"],
["Türkçe","Bir kral, halkının sesini duymak için her hafta kapısını açarmış. Bir gün bir dilenci gelip “Sizin altınlarınız mı değerli, yoksa sözleriniz mi?” diye sormuş.","Dilencinin sorusu aşağıdakilerden hangisini vurgulamaktadır?",["Altının değeri","Sözün ve dürüstlüğün değeri","Kralın zenginliği","Dilencinin ihtiyacı"],1,"Soru, değerin maddi varlıklardan çok söz ve dürüstlükte olabileceğini düşündürür.","Paragraf – ana düşünce"],
["Türkçe","Göl, rüzgârsız günlerde dingin bir ayna gibiydi.","Metinde geçen “dingin” sözcüğünün anlamca en yakın karşılığı hangisidir?",["Sakin","Hızlı","Karanlık","Kalabalık"],0,"“Dingin”, durgun ve sakin anlamına gelir.","Sözcükte anlam"],
["Türkçe","“Damlaya damlaya göl olur.”","Bu atasözü hangi düşünceyi anlatır?",["Acele iş şeytan işidir.","Küçük birikimler zamanla büyük sonuç verir.","Sabır acıdır.","Her işte başarı şanstır."],1,"Küçük şeylerin birikerek büyük sonuç vermesini anlatır.","Atasözleri ve deyimler"],
["Türkçe","Yazar, şiirde kullandığı imgelerle okurun zihninde canlı görüntüler oluşturmayı amaçlamıştır.","Metne göre yazarın amacı nedir?",["Okuru bilgilendirmek","Zihinde canlı görüntüler oluşturmak","Okuru eleştirmek","Ders vermek"],1,"Metin, imgelerin amacının canlı görüntüler oluşturmak olduğunu söyler.","Paragraf – yazarın tutumu"],
["Türkçe","Başarılı bir paragrafın konusu bellidir ve her cümle bu konuyu destekler.","Bu cümleye göre iyi bir paragrafta hangi özellik olmalıdır?",["Konu dağınık olmalı","Cümleler konuyu desteklemeli","Cümle sayısı çok olmalı","Yazar kendinden bahsetmeli"],1,"Metne göre paragraftaki her cümle konuyu desteklemelidir.","Paragraf – ana düşünce"],
["Türkçe","Ev sahibi, konuklarına ikram etmeyi bir görev değil, sevincini paylaşma biçimi olarak görürdü.","Ev sahibinin misafirperverliğiyle ilgili metinden hangisi çıkarılabilir?",["Misafirperverliği bir zorunluluk sayar.","İkramı sevinçle yapar.","Konukları sevmez.","İkramdan kaçınır."],1,"Metin, ikramın sevinçle yapıldığını anlatır.","Paragraf – anlam çıkarma"],
["Türkçe","Mehmet, yazın büyükannesinin köyüne gitti. Orada tarlada çalışmayı, akşamları ateş başında hikâye dinlemeyi çok sevdi.","Mehmet'in yaz tatilindeki en belirgin duygusu nedir?",["Sıkıntı","Mutluluk","Korku","Kızgınlık"],1,"Metin, Mehmet'in köyde yaptığı şeyleri sevdiğini anlatır.","Paragraf – anlam çıkarma"],
["Türkçe","Yolcu, treni kaçırdığını fark edince koşarak istasyona yetişmeye çalıştı; ama kapılar çoktan kapanmıştı.","Bu parçada hangi anlatım biçimi ağırlıklıdır?",["Öyküleme","Tartışma","Betimleme","Açıklama"],0,"Olay sırasıyla anlatıldığı için öyküleme ağırlıklıdır.","Anlatım biçimleri"],
["Türkçe","Şair, ilk dizede kendini bir kuşa benzetir; ikinci dizede ise kendi kendine konuşur.","Bu cümlede hangi söz sanatı vardır?",["Benzetme","Kişileştirme","Tezat","Abartma"],0,"“Kendini bir kuşa benzetir” ifadesi benzetmedir.","Söz sanatları"],
["Türkçe","Erkenden uyandım; fakat yağmur yüzünden okula yürüyerek gidemedim.","Cümlede kullanılan “fakat” bağlacı hangi anlam ilişkisini kurar?",["Neden–sonuç","Karşıtlık","Ekleme","Amaç"],1,"İki cümle arasında karşıt bir durum vardır.","Dil bilgisi – bağlaçlar ve cümle öğeleri"],
["Türkçe","Aşağıdaki cümlelerin hangisinde virgül kullanımı yanlıştır?",null,["Ali, Ayşe, Can geldi.","Sabah erkenden, kalktım.","Mehmet, arkadaşına kitap verdi.","Dışarıda yağmur yağıyordu."],1,"Zaman zarfından sonra özne ile yüklem arasına virgül konmaz.","Yazım ve noktalama"],
["Türkçe","Aşağıdaki sözcüklerin hangisi yanlış yazılmıştır?",null,["Hiçbir","Herkez","Bugün","Yarın"],1,"Doğrusu “herkes”tir.","Yazım ve noktalama"],
["Türkçe","“Kedi hızlıca koştu.” cümlesindeki “hızlıca” sözcüğü hangi sözcük türündedir?",null,["İsim","Sıfat","Zarf","Zamir"],2,"Fiili (koştu) nasıl yaptığını gösterdiği için zarftır.","Dil bilgisi – sözcük türleri"],
["Türkçe","“Güzel bir bahar günüydü.” cümlesindeki “güzel” sözcüğü hangi türdedir?",null,["Zarf","Sıfat","İsim","Zamir"],1,"İsmi niteleyen sözcük sıfattır.","Dil bilgisi – sözcük türleri"],
["Türkçe","“Koşarak gelen çocuk yorgundu.” cümlesindeki “koşarak” sözcüğü hangi türdedir?",null,["Zarf-fiil","İsim-fiil","Sıfat-fiil","Fiil"],0,"Fiilden türeyip fiili nasıl yapıldığını gösteren fiilimsi zarf-fiildir.","Dil bilgisi – fiilimsiler"],
["Türkçe","Aşağıdakilerin hangisinde sıfat-fiil vardır?",null,["Yorgun yorgun yürüdü.","Okuyan çocuk başarılı oldu.","Hızla koştu.","Ali gitti."],1,"“Okuyan” sözcüğü isim niteleyen bir sıfat-fiildir.","Dil bilgisi – fiilimsiler"],
["Türkçe","Aşağıdaki cümlelerin hangisinde anlatım bozukluğu vardır?",null,["Sadece bir tek kişi geldi.","Tüm öğrenciler geldi.","Kitabı dikkatle okudu.","Yarın yağmur yağacak."],0,"“Sadece” ve “tek” aynı anlamı tekrarlar.","Anlatım bozukluğu"],
["Türkçe","“Mahzun” sözcüğünün eş anlamlısı hangisidir?",null,["Neşeli","Üzgün","Kızgın","Dalgın"],1,"Mahzun, üzgün anlamına gelir.","Sözcükte anlam"],
["Türkçe","“Ferah” sözcüğünün zıt anlamlısı hangisidir?",null,["Geniş","Dar","Ağır","Kısa"],1,"Ferah, rahat ve geniş anlamındadır; zıt anlamı “dar”dır.","Sözcükte anlam"],

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const bankOf=m=>m==="lgs"?Q:DQN;
const solKey=m=>m==="lgs"?"sol":"dsol";
const idsOf=(m,d,k)=>bankOf(m).map((q,i)=>(q[0]===d&&(k===undefined||q[6]===k))?i:-1).filter(i=>i>=0);

const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function track(){const days=st.get("days",{});const t=today();days[t]=(days[t]||0)+1;st.set("days",days)}
function streak(){
  const days=st.get("days",{}), d=new Date();
  if(!days[dayKey(d)])d.setDate(d.getDate()-1);
  let n=0; while(days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}
function feedback(ok){
  if(st.get("sound",1)){
    try{
      const c=new (window.AudioContext||window.webkitAudioContext)();
      const o=c.createOscillator(), g=c.createGain();
      o.frequency.value=ok?880:220; g.gain.value=.05;
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.15);
    }catch(e){}
  }
  if(navigator.vibrate)navigator.vibrate(ok?20:[60,40,60]);
}

const KONU_ANLATIM={
"Sözcük türleri":["Sözcükler cümle içindeki görevlerine ve anlamlarına göre sınıflandırılır. Bu sınıflandırma, cümleyi doğru çözümlemek ve soruları doğru yorumlamak için temeldir.","İsimler varlık ve kavramları adlandırır: kitap, Ankara, sevgi. Sıfatlar isimleri niteler ve genellikle isimden önce gelir: güzel çiçek, büyük ev. Zamirler isimlerin yerini tutar: ben, sen, o, biz. Zarflar fiilleri, sıfatları ya da başka zarfları niteler; nasıl, ne zaman, ne kadar sorularına cevap verir: hızlı koştu, çok güzel.","Bir sözcüğün türünü anlamak için cümledeki işine bakılır. Güzel sözcüğü güzel bir gün cümlesinde sıfat, güzel konuştu cümlesinde zarf gibi davranabilir. Bu yüzden sözcüğü tek başına değil, cümle içinde değerlendir."],
"Cümle bilgisi":["Cümlenin temel öğeleri özne ve yüklemdir. Özne işi yapan ya da durumu taşıyan kişi veya varlıktır; yüklem ise işi ya da durumu bildirir.","Cümleler olumlu ya da olumsuz olabilir. Olumsuz cümle, fiile -me ya da -ma eki getirilerek kurulur: geldim, gelmedim.","Cümle türleri bildirdikleri anlama göre ayrılır. Bildirme cümlesi bir durumu anlatır, soru cümlesi soru sorar, ünlem cümlesi duyguyu anlatır, emir cümlesi bir işin yapılmasını ister. Soru türünü belirlemek için cümlenin sonuna ve mi soru ekine bakılır."],
"Yazım kuralları":["Yazım kuralları sözcüklerin ve eklerin doğru yazılmasını sağlar. En sık hata yapılan konular ayrı-bitişik yazım, büyük harf kullanımı ve sert ünsüz kuralıdır.","De ve da bağlaç ise ayrı yazılır: Sen de geldin. Ek ise bitişik yazılır: Evde kaldım. Ki de benzer şekilde bağlaç ya da ek olabilir; bağlaç olan ki ayrı, ek olan ki bitişik yazılır.","Ay ve gün adları küçük harfle yazılır: ağustos, pazartesi. Sözcük sonundaki p, ç, t, k sesleri ünlüyle başlayan ek aldığında sertleşebilir: kitap, kitabı. Büyük harf cümle başında, özel adlarda ve kısaltmalarda kullanılır."],
"Tam sayılar":["Tam sayılar sıfırın iki yanında uzanan sayılardır: ..., −2, −1, 0, 1, 2, ... Sayı doğrusunda sağa gidildikçe sayılar büyür, sola gidildikçe küçülür.","Toplamada aynı işaretli sayıların mutlak değerleri toplanır ve işaret korunur: (−4) + (−3) = −7. Farklı işaretli sayılarda mutlak değerlerin farkı alınır, sonuç mutlak değeri büyük olan sayının işaretini alır: (−8) + 5 = −3.","Çarpma ve bölmede aynı işaretliler pozitif, farklı işaretliler negatif sonuç verir: (−6) · (−2) = 12, (−20) ÷ 4 = −5."],
"Denklemler":["Denklem, eşitliğin iki tarafının eşit olduğu ve bilinmeyen bir değer içeren ifadedir. Amaç, bilinmeyeni yalnız bırakmaktır.","Eşitliğin her iki tarafına aynı sayı eklenebilir, çıkarılabilir, çarpılabilir ya da sıfırdan farklı bir sayıya bölünebilir. Bir terim karşıya geçtiğinde işareti değişir: x + 5 = 12 ise x = 12 − 5 = 7.","Katsayı varsa işlem tersine çevrilerek bulunur: 3x = 18 ise x = 6. Bulunan değeri denklemde yerine koyarak kontrol etmek hataları azaltır."],
"Üçgenler":["Üçgen, üç kenarı ve üç köşesi olan kapalı bir şekildir. Kenar uzunluklarına ve açılarına göre farklı türleri vardır.","İç açılar toplamı her zaman 180 derecedir. Eşkenar üçgende üç kenar ve üç açı eşittir, her açı 60 derecedir. İkizkenar üçgende iki kenar ve bunların karşısındaki iki açı eşittir.","Dik üçgende bir açı 90 derecedir ve dik kenarlarla hipotenüs arasında a² + b² = c² bağıntısı vardır (Pisagor). Üçgenin alanı taban ile yüksekliğin çarpımının yarısıdır."],
"Kuvvet ve hareket":["Kuvvet, bir cismi hareket ettirebilen, durduran ya da şeklini değiştirebilen etkidir. Kuvvetin birimi newton (N)'dur.","Ağırlık, yerçekiminin cisme uyguladığı kuvvettir: G = m · g. Dünya'da g yaklaşık 10 m/s² kabul edilir. Aynı yönlü kuvvetler toplanır, zıt yönlü olanlar çıkarılır.","Newton'un birinci yasasına göre net kuvvet sıfırsa cisim ya durur ya da sabit hızla doğrusal hareket eder. Sürtünme kuvveti harekete karşı etki eder. Hız, alınan yolun geçen süreye bölümüdür: v = x / t."],
"Madde ve ısı":["Maddeler katı, sıvı ve gaz hâlinde bulunur. Isı alındığında ya da verildiğinde madde hâl değiştirebilir.","Erime katıdan sıvıya, donma sıvıdan katıya geçiştir. Buharlaşma sıvıdan gaza, yoğuşma gazdan sıvıya geçiştir. Hâl değişimi sırasında sıcaklık sabit kalır; verilen ısı taneciklerin bağlarını koparmak ya da kurmak için kullanılır.","Buharlaşma sıcaklık ve yüzey alanı arttıkça, rüzgâr esdikçe hızlanır. Yoğunluk, birim hacmin kütlesidir: d = m / V. Bir cisim yoğunluğu içinde bulunduğu sıvıdan küçükse yüzer, büyükse batar."],
"Canlılar ve hücre":["Canlıların temel yapı birimi hücredir. Bazı canlılar tek hücreden, bazıları milyarlarca hücreden oluşur. Hücreler organel adı verilen küçük yapılarla işlevlerini yerine getirir.","Hücre zarı maddelerin giriş çıkışını düzenler. Çekirdek kalıtsal bilgiyi taşır. Mitokondri hücresel solunumla enerji üretir. Bitki hücresinde buna ek olarak hücre duvarı ve fotosentez yapan kloroplastlar bulunur.","Benzer hücreler bir araya gelerek dokuları, dokular organları, organlar sistemleri oluşturur. Amip ve bakteri gibi canlılar tek hücrelidir ve bütün yaşamsal işlevlerini tek hücreyle sürdürür."],
"Osmanlı'dan Cumhuriyete":["19. yüzyıldan itibaren Osmanlı Devleti gerileme dönemine girdi ve yenilik çabaları hızlandı. 20. yüzyılın başındaki savaşlar ve işgal yeni bir yönetim anlayışının doğmasına yol açtı.","Milli Mücadele, Mondros ve Sevr sonrasında işgale karşı başlatılan ulusal bir hareketti. 23 Nisan 1920'de TBMM açıldı ve egemenliğin millete ait olduğu ilan edildi.","1 Kasım 1922'de saltanat kaldırıldı, 29 Ekim 1923'te Cumhuriyet ilan edildi. 3 Mart 1924'te halifelik kaldırılarak eğitim birliği sağlandı ve laiklik yönünde adımlar atıldı."],
"Milli Mücadele":["Milli Mücadele, Osmanlı'nın işgal altında kalması ve Sevr Antlaşması'nın ağır koşulları üzerine başladı. Mustafa Kemal'in 19 Mayıs 1919'da Samsun'a çıkışı mücadelenin başlangıcı kabul edilir.","Amasya Genelgesi, Erzurum ve Sivas Kongreleri ulusal birliği ve ortak kararı sağladı. Ankara'da TBMM hükümeti kuruldu ve düzenli ordu güçlendirildi.","Sakarya Savaşı (1921) Yunan ilerleyişini durdurdu. Büyük Taarruz (1922) ile Batı Anadolu kurtarıldı. Mudanya Ateşkesi ve Lozan Antlaşması (1923) ile bağımsızlık uluslararası alanda kabul edildi."],
"Atatürk ilkeleri ve inkılaplar":["Atatürk ilkeleri Cumhuriyet'in temel felsefesidir: cumhuriyetçilik, milliyetçilik, halkçılık, devletçilik, laiklik ve inkılapçılık.","Laiklik din ve devlet işlerinin ayrılmasıdır. Milli egemenlik, egemenliğin millete ait olduğu anlayışıdır. Halkçılık toplumda sınıf ayrımı olmadan eşitliği savunur.","Önemli inkılaplar arasında Tevhid-i Tedrisat (1924), Medeni Kanun (1926), Harf İnkılabı (1928), kadınlara seçme ve seçilme hakkı (1934) ve Soyadı Kanunu (1934) bulunur."],
"İbadet":["İbadet, Allah'a yakınlaşmak için yapılan davranışlardır. İslam'ın beş şartı kelime-i şehadet, namaz, oruç, zekât ve haccı kapsar.","Namaz günde beş vakittir ve insanı düzenli, huzurlu ve sorumlu kılar. Oruç Ramazan ayında imsaktan iftara kadar yeme, içme ve cinsel ilişkiden uzak durmaktır.","Zekât, belirli bir servete ulaşan müslümanın mal varlığının belirli bir oranını ihtiyaç sahiplerine vermesidir. Hac, gücü yeten müslümanın belirli zaman ve mekânda yerine getirdiği farz bir ibadettir."],
"İman esasları":["İman, kalple tasdik ve dille ikrardır. İslam inancında altı iman esası vardır: Allah'a, meleklere, kitaplara, peygamberlere, ahirete ve kadere iman.","Melekler Allah'ın emirlerini yerine getiren varlıklardır. Kitaplar Allah'ın peygamberlere gönderdiği vahiylerdir; Kur'an-ı Kerim son kitaptır. Peygamberler insanları doğru yola çağırmakla görevlidir.","Ahiret inancı, dünyada yapılan iyi ve kötü davranışların karşılığının görüleceğine inanmaktır. Kader ise her şeyin Allah'ın bilgi ve takdiriyle olduğuna inanmak, insanın da sorumlu olduğunu kabul etmektir."],
"Ahlak":["Ahlak, insanın davranışlarını yönlendiren iyi ve kötü değerler bütünüdür. Doğruluk, adalet, merhamet, sorumluluk ve yardımseverlik temel değerler olarak ele alınır.","Doğruluk söz ve davranışta samimi olmaktır. Adalet herkese hakkını vermektir. Alçakgönüllülük kendini başkalarından üstün görmemektir.","Değerler yalnızca bilgiyle değil uygulamayla yaşanır. Başkasının sıkıntısını paylaşmak, verilen sözü tutmak ve sorumluluğu üstlenmek bu değerlerin günlük hayattaki karşılığıdır."],
"Çarpanlar ve katlar":["Bir sayıyı tam bölen sayılara çarpan, bir sayının tam katları olan sayılara kat denir. Asal çarpanlara ayırma, sayıların ortak özelliklerini bulmanın yoludur.","EBOB ortak çarpanların en büyüğü, EKOK ortak katların en küçüğüdür. 12 = 2²·3 ve 18 = 2·3² için EBOB 6, EKOK 36'dır."],
"Üslü ifadeler":["a üssü n, a tabanının n kez çarpımıdır. Tabanlar aynıysa çarpımda üsler toplanır, bölümde çıkarılır: a^m · a^n = a^(m+n), a^m / a^n = a^(m−n).","Üssün üssü alındığında üsler çarpılır: (a^m)^n = a^(m·n). Sıfırdan farklı her sayının sıfırıncı kuvveti 1'dir."],
"Kareköklü ifadeler":["√a, karesi a olan negatif olmayan sayıdır. √49 = 7'dir. Kök içindeki sayı tam kare çarpanına ayrılarak sadeleştirilir: √50 = √(25 · 2) = 5√2.","Kareköklü ifadeler toplanırken aynı kökler birleşir: 3√2 + 2√2 = 5√2. Farklı kökler birleştirilemez."],
"Veri analizi":["Aritmetik ortalama, verilerin toplamının veri sayısına bölümüdür. Medyan sıralanmış verinin ortasındaki değerdir; veri sayısı çiftse ortadaki iki değerin ortalaması alınır.","Mod en çok tekrar eden değerdir. Açıklık en büyük ile en küçük değerin farkıdır. Bu ölçüler birlikte kullanıldığında verinin genel durumu daha iyi anlaşılır."],
"Olasılık":["Bir olayın olasılığı, istenen durum sayısının tüm durum sayısına oranıdır: P(A) = istenen / tümü. Olasılık 0 ile 1 arasında değer alır.","0 olasılık imkânsız olayı, 1 kesin olayı gösterir. Zar, para ve torba soruları bu formülle çözülür."],
"Cebirsel ifadeler":["Harf içeren ifadelere cebirsel ifade denir. Benzer terimlerin yalnızca katsayıları toplanır: 2x + 3x = 5x.","Özdeşlikler her değer için doğru eşitliklerdir: (a + b)² = a² + 2ab + b², (a − b)² = a² − 2ab + b², (a + b)(a − b) = a² − b²."],
"Eşitsizlik":["Eşitsizlikler iki ifadenin büyük, küçük ya da eşit olmadığını gösterir: <, >, ≤, ≥. Denklem gibi çözülür; bir terim karşıya geçince işareti değişir.","Eşitsizliğin iki tarafı negatif bir sayıyla çarpılır ya da bölünürse yön değişir: −2x > 6 ise x < −3."],
"Eşlik ve benzerlik":["Eş şekiller aynı büyüklük ve biçimde olan şekillerdir; karşılık gelen kenar ve açıları eşittir. Benzer şekillerin biçimleri aynı, boyutları farklıdır.","Benzer üçgenlerde karşılık gelen açılar eşit, karşılık gelen kenarlar orantılıdır. Bu oran benzerlik oranıdır."],
"Pisagor":["Dik üçgende en uzun kenar hipotenüstür. Dik kenarların karelerinin toplamı hipotenüsün karesine eşittir: a² + b² = c².","Bağıntı yalnızca dik üçgende geçerlidir. 3-4-5 ve 6-8-10 gibi üçlüler işlemi kolaylaştırır."],
"Dönüşüm geometrisi":["Öteleme şekli belirli bir yönde ve uzaklıkta kaydırır. Yansıma şeklin bir doğruya göre simetriğini alır. Dönme şekli bir nokta etrafında belirli bir açı kadar döndürür.","Dönüşümlerde şeklin boyutu ve biçimi korunur; yalnızca yeri ya da yönü değişir. Yansımada şekil ters yönlüdür."],
"Geometrik cisimler":["Küp altı eş kareden, dikdörtgenler prizması altı dikdörtgenden oluşur. Silindir, koni ve küre de yüzleri ve hacimleriyle ayırt edilir.","Prizmanın ve silindirin hacmi taban alanı ile yüksekliğin çarpımıdır. Küpün hacmi a³'tür. Silindirin taban alanı π · r²'dir."],
"Yüzde ve oran-orantı":["Yüzde bir miktarın 100 üzerinden değeridir. %20 artış değeri 1,20 ile çarpmak demektir. Oran iki büyüklüğün bölümüdür; orantı iki oranın eşitliğidir.","Doğru orantıda bir büyüklük artarken diğeri aynı oranda artar: 3 kalem 12 TL ise 7 kalem 28 TL eder. Ters orantıda biri artarken diğeri azalır."],
"Noktalama işaretleri":["Nokta cümlenin sonunda ve kısaltmalardan sonra kullanılır: Dr., Prof., Av. Virgül sıralanan öğeler arasında ve cümle içindeki kısa duraklamalarda konur.","Soru işareti soru cümlesinin sonuna, ünlem işareti duygu bildiren cümlelerin sonuna gelir. Üç nokta düşünceyi yarıda bırakmak için kullanılır."],
"Fiilimsiler":["Fiilden türeyen ama cümlede fiil görevi yapmayan sözcüklere fiilimsi denir. Üç türü vardır: isim-fiil, sıfat-fiil ve zarf-fiil.","İsim-fiil -mek, -ma ekiyle isim gibi davranır (gelmek için). Sıfat-fiil isimleri niteler (okuyan çocuk). Zarf-fiil fiilin nasıl yapıldığını gösterir (koşarak gitti)."],
"Sözcükte anlam":["Sözcükler gerçek ve mecaz anlamda kullanılabilir. Gerçek anlam sözcüğün temel anlamıdır; mecaz anlam bağlama göre kazanılan yeni anlamdır.","Eş anlamlı sözcükler aynı ya da çok yakın anlamdadır; zıt anlamlılar birbirinin karşıtıdır. Hangi anlamda kullanıldığı cümlenin bütününden anlaşılır."],
"Söz sanatları":["Söz sanatları anlatımı güçlendirir. Benzetme iki varlık arasında benzerlik kurar (kadar, gibi ile). Kişileştirme cansız varlıklara insan özelliği verir.","Abartma bir durumu olduğundan büyük ya da küçük göstermektir. Tezat zıt kavramları yan yana getirmektir. Yineleme aynı sözcük ya da söz öbeğinin tekrarıdır."],
"Anlatım biçimleri":["Anlatım biçimleri öyküleme, betimleme, tartışma ve açıklama olarak ayrılır. Öyküleme olay ve zaman sırasını; betimleme bir varlığın özelliklerini anlatır.","Tartışma bir düşünceyi kanıtlarla savunur; açıklama bir kavramı ya da durumu bilgi vererek anlatır. Bir metinde birden fazla anlatım biçimi birlikte bulunabilir."],
"Paragraf":["Paragraf, belli bir konuyu işleyen birkaç cümleden oluşan bölümdür. Konu, paragrafta üzerinde durulan genel varlık ya da olaydır.","Ana düşünce paragrafın tamamını kapsayan ve yazarın asıl vurguladığı düşüncedir. Yardımcı düşünceler ana düşünceyi destekler ve açıklar."],
"Atasözleri ve deyimler":["Atasözleri toplumun deneyimlerini özetleyen, öğüt veren kalıplaşmış sözlerdir. Deyimler gerçek anlamından farklı, mecaz anlam taşıyan kalıplaşmış söz öbekleridir.","Deyimler cümle içinde yeni anlamla kullanılır: kulak vermek dinlemek, göz doldurmak beğendirmek anlamına gelir. Atasözü tam bir cümledir; deyim ise cümlenin parçasıdır."],
"Anlatım bozukluğu":["Anlatım bozukluğu, anlamın yanlış ya da belirsiz olmasına yol açan kullanımlardır. Aynı anlamı taşıyan sözcüklerin gereksiz yere yan yana gelmesi en sık görülen türdür.","Özne ile yüklemin uyumsuzluğu, yanlış sözcük seçimi ve mantık hatası da anlatım bozukluğudur. Gereksiz tekrar yerine tek bir sözcük tercih edilmelidir."],
"Elektrik":["Elektrik akımı, yüklü parçacıkların hareketidir ve birimi amperdir. Gerilim (volt) akımı harekete geçiren etkidir; direnç (ohm) akıma karşı koyar.","Pilleri seri bağlarsak gerilimler toplanır. Metaller elektriği iyi iletir (iletken), plastik ve cam ise iletmez (yalıtkan)."],
"Işık":["Işık doğrusal yayılır. Düz bir yüzeye çarpıp geri dönmesine yansıma, ortam değiştirirken yön değiştirmesine kırılma denir.","Engelin arkasında oluşan karanlık bölge gölgedir. Gölge, ışığın doğrusal yayılmasının sonucudur."],
"Basınç":["Basınç, birim alana düşen kuvvettir: P = F / A. Aynı kuvvet daha küçük bir alana uygulanırsa basınç artar.","Sıvıların basıncı derinlikle artar. Kar ayakkabısı geniş alan sağlayarak basıncı azaltır."],
"Dünya ve Evren":["Dünya kendi ekseni etrafında yaklaşık 24 saatte bir kez döner; bu hareket gece ve gündüzü oluşturur. Güneş etrafında yaklaşık bir yılda bir tur atar.","Mevsimler, Dünya'nın eksen eğikliği nedeniyle Güneş ışınlarının düşme açısının değişmesinden oluşur. Ay'ın evreleri ise Ay'ın Dünya çevresindeki konumuna bağlıdır."],
"Kalıtım ve üreme":["Kalıtsal özellikler genlerle taşınır. Genler kromozomlar üzerinde yer alır ve anne babadan çocuğa aktarılır.","Eşeyli üremede iki farklı üreme hücresi birleşir. Eşeysiz üremede ise tek ebeveyn, tomurcuklanma ya da bölünme ile yeni birey oluşturur."],
"Ekosistem ve enerji":["Ekosistemdeki canlılar üretici, tüketici ve ayrıştırıcı olarak sınıflandırılır. Üreticiler güneş enerjisiyle besin üretir.","Enerji üreticiden tüketiciye doğru tek yönlü akar ve her basamakta bir kısmı ısı olarak kaybolur. Ayrıştırıcılar ölü maddeleri parçalayarak madde döngüsünü sürdürür."],
"Asitler ve bazlar":["Asitler ekşi tatlı, pH değeri 7'nin altında olan maddelerdir. Bazlar kaygan hissettirir ve pH değeri 7'nin üstündedir. PH 7 nötrdür.","Asit ile baz karıştığında nötrleşme tepkimesi gerçekleşir. Limon suyu ve sirke asidik, çamaşır suyu bazik özellik gösterir."],
"Ses":["Ses, maddesel bir ortamda yayılan mekanik bir dalgadır; boşlukta yayılamaz. Sesin kaynağı titreşir ve bu titreşim ortam aracılığıyla kulağa ulaşır.","Sesin şiddeti genliğe, tizliği frekansa bağlıdır. Frekans bir saniyedeki titreşim sayısıdır."],
"Mondros ve Sevr dönemi":["1918'de imzalanan Mondros Mütarekesi ile İstanbul ve birçok önemli bölge işgale uğradı. Osmanlı'nın askerî gücü bu süreçte büyük ölçüde azaltıldı.","Sevr Antlaşması, Osmanlı topraklarının büyük bölümünün paylaşılmasını öngörüyordu. Bu antlaşma Türk milletinin bağımsızlık mücadelesini başlatan temel nedenlerden biri oldu."],
"Dış politika":["Atatürk dönemi dış politikası “Yurtta sulh, cihanda sulh” ilkesine dayanıyordu. Barışçıl ilişkiler ve komşularla iyi geçinme amaçlanıyordu.","Türkiye 1932'de Milletler Cemiyeti'ne üye oldu. Balkan Antantı (1934) ve Sadabat Paktı (1937) bölgesel barışı güçlendirmek için kuruldu."],
"Milli eğitim inkılapları":["Tevhid-i Tedrisat (1924) ile eğitim tek elde toplandı. Böylece laik ve birlikte bir eğitim sistemi kuruldu.","Köy Enstitüleri kırsal kesimde eğitimi yaygınlaştırmak için kuruldu. Halkevleri ise halkın kültürel ve sosyal gelişimine katkı amacıyla açıldı."],
"Hukuk inkılapları":["Medeni Kanun (1926) aile ve miras hukukunda eşitlik yönünde önemli değişiklikler getirdi. Çok eşlilik kaldırıldı.","Türk Ceza Kanunu (1926) ile çağdaş bir ceza hukuku sistemi benimsendi. Hukuk alanındaki bu inkılaplar laik devlet anlayışının temelini oluşturdu."],
"Ekonomi politikaları":["1930'larda Türkiye devletçilik ilkesini benimsedi. Devlet ekonomide yatırım yaparak sanayileşmeyi hedefledi.","Birinci Beş Yıllık Sanayi Planı (1934) ile sanayi tesisleri kuruldu. İzmir İktisat Kongresi (1923) ise ekonomi politikalarının temel ilkelerini tartışmak için toplandı."],
"Cumhuriyet'in ilk yılları":["Cumhuriyet'in ilanından sonra başkent Ankara oldu. Yeni devlet kurumlarının kurulması ve yönetimin düzenlenmesi bu dönemin önemli başlıklarıdır.","Tek parti döneminde iktidarda Cumhuriyet Halk Partisi bulundu. Şeyh Sait İsyanı (1925) gibi iç isyanlar bu dönemde bastırıldı."],
"Atatürk dönemi kültür ve sanat":["Türk Tarih Kurumu (1931) ve Türk Dil Kurumu (1932) milli kültürü ve dili araştırmak için kuruldu. Türkçe'nin öz Türkçe kökleriyle zenginleşmesi hedeflendi.","Ankara Devlet Konservatuvarı (1936) müzik ve sanat eğitimi için açıldı. Bu dönemde sanat ve kültür kurumları çağdaş bir çizgide gelişti."],
"Hz. Muhammed'in hayatı":["Hz. Muhammed Mekke'de doğdu. Kırk yaşında ilk vahyi Hira Mağarası'nda aldı ve peygamberlik görevine başladı.","Hicret, Müslümanların baskı nedeniyle Mekke'den Medine'ye göçüdür. Hicret, İslam takviminin başlangıcı kabul edilir."],
"Kur'an-ı Kerim":["Kur'an-ı Kerim, Allah'ın Hz. Muhammed'e Arapça olarak vahyettiği kutsal kitaptır. 114 sureden oluşur.","İlk inen sure Alak suresidir. Kur'an insanlara doğru yolu gösteren ve hayatı düzenleyen temel kaynaktır."],
"Peygamberler":["Peygamberler insanları Allah'ın birliğine ve doğru yola çağırmakla görevlidir. Hz. Muhammed son peygamberdir.","Hz. İbrahim tevhid inancı ve sadakatiyle tanınır. Peygamberlerin ortak mesajı, yalnız Allah'a kulluk etmektir."],
"Hac ve kurban":["Hac, Zilhicce ayında Mekke'de yapılan ve gücü yeten müslümanlara farz olan bir ibadettir.","Kurban, Allah rızası için fedakârlık ve paylaşmanın simgesidir. Kurban Bayramı Zilhicce'nin 10. gününden itibaren kutlanır."],
"Dinî kavramlar":["Tevekkül, çabayı gösterip sonucu Allah'a bırakmaktır. Hayır iyiliği, şer kötülüğü anlatır.","Takva, Allah'tan sakınarak kötülüklerden uzak durmaktır. Bu kavramlar ahlaki davranışların temelini oluşturur."],
"Din ve hayat":["Din inanç, ibadet ve ahlak yoluyla bireyin davranışlarını ve değerlerini yönlendirir.","Dinî bilgilerin doğru yorumlanması yanlış anlamaları önler. Hoşgörü toplumsal barışı ve birliği güçlendirir."],
"Future":["Will, anlık kararlar ve gelecek tahminleri için kullanılır: I'll help you. Be going to önceden verilmiş kararlar ve kanıta dayalı tahminler için kullanılır: It is going to rain.","Olumsuzda will not (won't) ya da be not going to kullanılır. Soruda Will ya da Are/Is cümlenin başına gelir."],
"Present continuous":["Present continuous şu anda devam eden eylemler için kullanılır. Yapısı am/is/are + fiil-ing şeklindedir: She is reading now.","Olumsuz cümlede not eklenir, soruda be fiili başa geçer: Are they playing? Now, at the moment, look! zaman ifadeleri sık görülür."],
"Comparatives":["Kısa sıfatlara -er eklenerek karşılaştırma yapılır: taller, bigger. Uzun sıfatların önüne more gelir: more interesting.","Üstünlük derecesinde kısa sıfatlara -est, uzun sıfatlara most eklenir: the tallest, the most interesting."],
"Modals":["Modal fiiller (can, must, should) fiilden önce gelir ve kişiye göre değişmez. Yetenek için can, öneri için should kullanılır.","Olumsuzda can't, mustn't, shouldn't kullanılır. Soru cümlesinde modal fiil başa gelir: Can you swim?"],
"Prepositions of time":["Saatle at, günlerle on, ay ve yıl ile in kullanılır: at 7 o'clock, on Monday, in July, in 2026.","Sık kullanılan zaman ifadelerini kalıp olarak ezberlemek bu konuda en hızlı çözümdür."],
"Personality and friendship":["Kişilik sıfatları karakteri anlatır: kind (nazik), honest (dürüst), brave (cesur), lazy (tembel), shy (utangaç).","Zıt anlamlı çiftler öğrenmeyi kolaylaştırır: honest - dishonest, kind - unkind."],
"Transport and travel":["Ulaşım kelimeleri: bus, train, ship, plane, bicycle. Yer kelimeleri: airport, station, harbour, bus stop.","Bilet alma ve binme ile ilgili ifadeler günlük yaşamda işe yarar: buy a ticket, wait for the bus, get on the train."],
"Present simple":["Present simple alışkanlıkları, genel doğruları ve rutin işleri anlatmak için kullanılır: I study every day. Water boils at 100 degrees.","Olumlu cümlede I, you, we, they öznelerinde fiil yalın hâlde kalır. He, she, it gibi üçüncü tekil şahıslarda fiile -s ya da -es eklenir: She goes to school.","Olumsuz cümlede do not ya da does not (don't, doesn't) kullanılır: They don't play. Soru cümlesinde Do ya da Does cümlenin başına gelir: Does he like tea?"],
"Past simple":["Past simple geçmişte başlayıp biten eylemleri anlatır. Yesterday, last week, in 2010 gibi zaman ifadeleriyle sık kullanılır.","Düzenli fiillere -ed eklenir: play, played; visit, visited. Düzensiz fiiller ayrı öğrenilir: go, went; be, was ya da were; read geçmişte farklı okunur.","Olumsuzda did not (didn't) ve fiilin yalın hâli kullanılır: She didn't come. Soruda Did cümlenin başına gelir ve fiil yalın hâlde kalır: Did you call me?"],
"Daily life":["Günlük hayat kelimeleri ev, okul, alışveriş, yemek ve şehir gibi alanlardaki sözcükleri kapsar. Kelimeleri konulara göre gruplamak öğrenmeyi kolaylaştırır.","Mekânlar: bakery (fırın), library (kütüphane), hospital (hastane), airport (havalimanı). Eşyalar: pen (kalem), spoon (kaşık), window (pencere). Zıt anlamlılar hot-cold, dry-wet, dark-light gibi çiftlerle öğrenilebilir.","Soru kalıpları günlük yaşamda sık geçer: Where do you buy bread? What time do you wake up? Bu kalıpları kelimelerle birlikte çalışmak sınavda hızlı cevap vermeni sağlar."]
};
function noteBox(q){return `<textarea class="note" data-note="${esc(q[2])}" rows="2" placeholder="Kişisel not">${esc((st.get("notes",{})[q[2]])||"")}</textarea>`}
function bindNotes(){
  document.querySelectorAll("textarea.note").forEach(t=>t.onchange=()=>{
    const n=st.get("notes",{}); n[t.dataset.note]=t.value; st.set("notes",n);
  });
}
function exportWrong(d){
  const w=st.get("dwrong",[]).filter(q=>!d||q[0]===d), notes=st.get("notes",{});
  const txt=w.map((q,i)=>`${i+1}. [${q[0]} · ${q[6]}] ${q[2]}\n${q[3].map((o,j)=>L[j]+") "+o).join("\n")}\nDoğru cevap: ${L[q[4]]}\n${q[5]}${notes[q[2]]?"\nNot: "+notes[q[2]]:""}`).join("\n\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([txt||"Yanlış yok."],{type:"text/plain;charset=utf-8"}));
  a.download="yanlislar.txt"; a.click();
}

const START={home:["home"],lgs:["subjects","lgs"],ders:["subjects","ders"],sim:["sim"],plan:["plan"]};
const tabs=[["home","Ana sayfa"],["lgs","LGS Çalışma"],["ders","Ders Çalışma"],["sim","LGS Simülesi"],["plan","Planım"]];
let timer=null, ex=null;
const V={};

$("#nav").innerHTML=tabs.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join("");
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){const t=b.dataset.t;go(t,...START[t])}};

function go(tab,view,...a){
  clearInterval(timer); ex=null; qz=null; $("#v").onclick=null;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  V[view](tab,...a);
}

const qhtml=(q,i,fb)=>`<div class="box" data-q="${i}">
  <div class="tag">${esc(q[0])} · ${esc(q[6])}</div>
  ${q[1]?`<div class="metin">${esc(q[1])}</div>`:""}
  ${q[2]?`<div><b>${esc(q[2])}</b></div>`:""}

const QUIZ_N=40;
V.quiz=(tab,m,d,mode)=>{
  qz={tab,m,d,mode,list:[],queue:[],i:0,cur:null,score:0,streak:0,best:0,n:0,locked:false,log:[],tl:+st.get("dtime",25)};
  if(mode==="wrong"){
    qz.list=st.get("dwrong",[]).filter(q=>!d||q[0]===d);
    if(!qz.list.length){
      $("#v").innerHTML=`<div class="box"><p>Yanlışın yok. Önce bir quiz çöz.</p><button class="btn o" id="bk">← Geri</button></div>`;
      $("#bk").onclick=()=>d?go(tab,"dmenu",m,d):go("home","home");
      qz=null; return;
    }
  } else {
    qz.queue=shuf(DQN).slice(0,QUIZ_N);
  }
  $("#v").innerHTML=`
  <div class="row" style="margin-bottom:12px">
    <b>${mode==="wrong"?"Yanlışlarım":"Karışık quiz · "+QUIZ_N+" soru"}</b>
    <label class="mut" style="margin-left:auto">Süre
      <select id="tl">${[0,15,25,40].map(s=>`<option value="${s}" ${s===qz.tl?"selected":""}>${s?s+" sn":"Kapalı"}</option>`).join("")}</select>
    </label>
  </div>
  <div id="qarea"></div>
  <p style="text-align:center;margin-top:12px"><button class="btn o" id="stop">Bitir ve özet</button></p>`;
  $("#tl").onchange=e=>{qz.tl=+e.target.value; st.set("dtime",qz.tl)};
  $("#stop").onclick=()=>quizSummary();
  qz.cur=mode==="wrong"?pickWrong():qz.queue[0];
  renderQ();
};

function pickWrong(){return qz.list[Math.floor(Math.random()*qz.list.length)]}

function renderQ(){
  const q=qz.cur; qz.locked=false;
  const isQuiz=qz.mode!=="wrong", last=isQuiz&&qz.i===qz.queue.length-1;
  const prog=isQuiz?`Soru ${qz.i+1} / ${qz.queue.length}`:"Yanlış sorular";
  $("#qarea").innerHTML=`<div class="box">
    ${isQuiz?`<div class="bar" style="margin:0 0 10px"><i style="width:${Math.round(qz.i/qz.queue.length*100)}%"></i></div>`:""}
    <div class="row" style="justify-content:space-between"><span class="tag">${esc(q[0])} · ${esc(q[6])}</span><span class="mut">${prog} · ${qz.score}/${qz.n} doğru · seri ${qz.streak}</span></div>
    <div style="margin:10px 0"><b>${esc(q[2])}</b></div>
    ${q[3].map((o,j)=>`<button class="opt" data-j="${j}">${L[j]}) ${esc(o)}</button>`).join("")}
    ${qz.tl?'<div class="bar" style="margin-top:12px"><i id="ti" style="width:100%"></i></div>':""}
    <div class="exp hide" id="ex"></div>
    ${noteBox(q)}
    <div class="row hide" id="nxr" style="margin-top:10px"><button class="btn" id="nxt">${last?"Bitir":"Sonraki soru"}</button></div>
  </div>`;
  document.querySelectorAll("#qarea .opt").forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  $("#nxt").onclick=nextQ;
  bindNotes();
  if(qz.tl){
    let rem=qz.tl;
    timer=setInterval(()=>{
      rem--;
      const bar=$("#ti"); if(bar)bar.style.width=(rem/qz.tl*100)+"%";
      if(rem<=0){clearInterval(timer);answer(-1)}
    },1000);
  }
}

function answer(j){
  if(qz.locked)return;
  qz.locked=true; clearInterval(timer);
  const q=qz.cur, ok=j===q[4];
  qz.n++; qz.log.push({q,ok});
  track(); feedback(ok);
  if(ok){
    qz.score++; qz.streak++; qz.best=Math.max(qz.best,qz.streak);
    if(qz.mode==="wrong")unwrong(q);
  } else {
    qz.streak=0; addWrong(q);
  }
  document.querySelectorAll("#qarea .opt").forEach((x,k)=>{
    if(k===q[4])x.classList.add("ok");
    else if(k===j)x.classList.add("no");
  });
  const ex=$("#ex"); ex.classList.remove("hide");
  ex.textContent=(ok?"Doğru. ":j===-1?"Süre doldu. Doğru cevap "+L[q[4]]+". ":"Yanlış. Doğru cevap "+L[q[4]]+". ")+q[5];
  $("#nxr").classList.remove("hide");
}

function nextQ(){
  if(qz.mode==="wrong"){
    if(!qz.list.length){quizSummary();return}
    qz.cur=pickWrong();
  } else {
    if(qz.i>=qz.queue.length-1){quizSummary();return}
    qz.i++; qz.cur=qz.queue[qz.i];
  }
  renderQ();
}

function quizSummary(){
  clearInterval(timer);
  if(!qz)return;
  const {tab,m,d,mode,n,score,best,log}=qz;
  const acc=n?Math.round(score/n*100):0;
  const byD={};
  log.forEach(x=>{const s=byD[x.q[0]]=byD[x.q[0]]||[0,0]; s[x.ok?0:1]++});
  const rows=Object.entries(byD).map(([k,s])=>`<p class="mut" style="margin:2px 0">${k}: ${s[0]} doğru, ${s[1]} yanlış</p>`).join("");
  qz=null;
  $("#v").innerHTML=`<div class="box">
    <h2 style="margin-top:0;font-size:1.2em">${mode==="wrong"?"Yanlışlar özeti":"Quiz özeti"}</h2>
    <div class="big">${score}/${n}</div>
    <p class="mut">Başarı %${acc} · En uzun seri ${best}</p>
    ${rows}
    <div class="row" style="margin-top:12px"><button class="btn" id="again">Yeniden başla</button><button class="btn o" id="back">Ana sayfa</button></div></div>`;
  $("#again").onclick=()=>go(tab,"quiz",m,d,mode);
  $("#back").onclick=()=>go("home","home");
}

function addWrong(q){
  const w=st.get("dwrong",[]);
  if(!w.some(x=>x[2]===q[2])){
    w.unshift([q[0],q[1],q[2],q[3],q[4],q[5],q[6]]);
    st.set("dwrong",w.slice(0,300));
  }
}
function unwrong(q){
  st.set("dwrong",st.get("dwrong",[]).filter(x=>x[2]!==q[2]));
  qz.list=qz.list.filter(x=>x[2]!==q[2]);
}

/* ---------- LGS simülesi ---------- */
V.sim=()=>{
  $("#v").innerHTML=`<div class="box">
    <h2 style="margin-top:0;font-size:1.2em">LGS Simülesi</h2>
    <p class="mut">${SIM_TOTAL} soru · ${SIM_MIN} dakika · Net = Doğru − Yanlış ÷ 3</p>
    <p class="mut" style="font-size:.9em">Dağılım: ${Object.entries(SIM_COUNT).map(([d,n])=>`${d} ${n}`).join(", ")}. Sorular her seferinde bankadan yeniden seçilir.</p>
    <button class="btn" id="go">Başla</button></div>`;
  $("#go").onclick=()=>{
    const qs=shuf(Object.keys(SIM_COUNT).flatMap(d=>shuf(idsOf("lgs",d)).slice(0,SIM_COUNT[d])));
    ex={qs:shuf(qs),a:{},i:0,t:SIM_MIN*60};
    timer=setInterval(()=>{
      ex.t--;
      const s=$("#tm"); if(s)s.textContent=fmt(ex.t);
      if(ex.t<=0)finish();
    },1000);
    qview();
  };
};

function qview(){
  const n=ex.qs[ex.i], q=Q[n];
  $("#v").innerHTML=`
  <div class="row" style="margin-bottom:10px">
    <b>Soru ${ex.i+1} / ${ex.qs.length}</b>
    <b id="tm" style="margin-left:auto">${fmt(ex.t)}</b>
  </div>
  ${qhtml(q,n,0)}
  <div class="row">
    <button class="btn o" id="pv" ${ex.i?"":"disabled"}>Önceki</button>
    <button class="btn o" id="nx" ${ex.i<ex.qs.length-1?"":"disabled"}>Sonraki</button>
    <button class="btn" id="fn" style="margin-left:auto">Bitir</button>
  </div>`;
  document.querySelectorAll(".opt").forEach(b=>{
    if(ex.a[n]===+b.dataset.j)b.classList.add("sel");
    b.onclick=()=>{ex.a[n]=+b.dataset.j;qview()};
  });
  $("#pv").onclick=()=>{ex.i--;qview()};
  $("#nx").onclick=()=>{ex.i++;qview()};
  $("#fn").onclick=finish;
}

function finish(){
  clearInterval(timer);
  if(!ex)return;
  let d=0,y=0,b=0; const by={};
  ex.qs.forEach(n=>{
    const q=Q[n], s=by[q[0]]=by[q[0]]||[0,0,0];
    if(ex.a[n]===undefined){b++;s[2]++}
    else if(ex.a[n]===q[4]){d++;s[0]++}
    else{y++;s[1]++}
  });
  const net=+(d-y/3).toFixed(2), r=st.get("res",[]);
  for(let i=0;i<d+y;i++)track();
  r.push({t:Date.now(),d,y,b,net}); st.set("res",r);
  $("#v").innerHTML=`<div class="box">
    <h2 style="margin-top:0">Sonuç</h2>
    <div class="big">${net} net</div>
    <p>${d} doğru · ${y} yanlış · ${b} boş</p>
    ${Object.entries(by).map(([k,s])=>`<p class="mut" style="margin:2px 0">${k}: ${s[0]}D ${s[1]}Y ${s[2]}B → ${(s[0]-s[1]/3).toFixed(1)} net</p>`).join("")}
    <p><button class="btn" id="again">Yeni simülasyon</button></p></div>`;
  $("#again").onclick=()=>go("sim","sim");
  ex=null;
}

    ${done>=goal?'<p style="margin:8px 0 0;color:var(--ok);font-weight:600">Bugünkü hedef tamamlandı.</p>':""}
    <div class="row" style="margin-top:12px">
      <label class="mut">Günlük hedef <input id="goal" type="number" min="1" max="500" value="${goal}" style="width:90px"></label>
      <label class="mut" style="margin-left:auto"><input id="snd" type="checkbox" ${sound?"checked":""} style="width:auto"> Ses ve titreşim</label>
    </div>
  </div>
  <div class="row">
    <input id="pi" placeholder="Bugün ne çalışacaksın?">
    <button class="btn" id="pa">Ekle</button>
  </div>
  <div style="margin-top:16px">${p.map((x,i)=>`
    <div class="box row">
      <input type="checkbox" style="flex:none;width:20px;height:20px" data-i="${i}" ${x.d?"checked":""}>
      <span class="${x.d?"done":""}" style="flex:1">${esc(x.t)}</span>
      <button class="btn o" data-x="${i}">Sil</button>
    </div>`).join("")||'<p class="mut">Henüz görev yok.</p>'}
  </div>`;
  $("#goal").onchange=e=>{st.set("goal",Math.max(1,+e.target.value||20));renderPlan()};
  $("#snd").onchange=e=>st.set("sound",e.target.checked?1:0);
  const add=()=>{const t=$("#pi").value.trim(); if(!t)return; p.unshift({t,d:0}); st.set("plan",p); renderPlan()};
  $("#pa").onclick=add;
  $("#pi").onkeydown=e=>{if(e.key==="Enter")add()};
  $("#v").onclick=e=>{
    const c=e.target.closest("[data-i]"), x=e.target.closest("[data-x]");
    if(c){p[c.dataset.i].d=c.checked?1:0; st.set("plan",p); renderPlan()}
    if(x){p.splice(x.dataset.x,1); st.set("plan",p); renderPlan()}
  };
}

// Klavye kısayolları: 1-4 şık, Enter sonraki soru
document.addEventListener("keydown",e=>{
  if(!qz||!qz.cur||!$("#qarea")||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(!qz.locked&&e.key>="1"&&e.key<="4")answer(+e.key-1);
  else if(qz.locked&&e.key==="Enter")nextQ();
});

go("home","home");
</script>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}
</script>
